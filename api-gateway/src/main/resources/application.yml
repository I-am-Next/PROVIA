server:
  port: 4007

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # =====================
            # AUTH SERVICE
            # =====================
            - id: auth-service
              uri: http://localhost:4002
              predicates:
                - Path=/api/v1/auth/**

            # =====================
            # USER SERVICE
            # =====================
            - id: user-service
              uri: http://localhost:4003
              predicates:
                - Path=/api/v1/users/**

            # =====================
            # PROVIDER SERVICE
            # =====================
            - id: provider-service
              uri: http://localhost:4004
              predicates:
                - Path=/providers/**

            # =====================
            # SEARCH SERVICE
            # =====================
            - id: search-service
              uri: http://localhost:5000
              predicates:
                - Path=/api/v1/search/**

            # =====================
            # SERVICE CATALOG
            # =====================
            - id: service-catalog
              uri: http://localhost:5006
              predicates:
                - Path=/catalog/**

            # =====================
            # MEDIA STORAGE SERVICE
            # =====================
            - id: media-storage
              uri: http://localhost:4011
              predicates:
                - Path=/api/v1/media/**

            # =====================
            # BOOKING SERVICE
            # =====================
            - id: booking-service
              uri: http://localhost:4001
              predicates:
                - Path=/api/v1/bookings/**
              filters:
                - StripPrefix=2

                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, INTERNAL_SERVER_ERROR
                    methods: GET, POST, PATCH

                - name: CircuitBreaker
                  args:
                    name: bookingService
                    fallbackUri: forward:/fallback/booking

            # =====================
            # PAYMENT SERVICE
            # =====================
            - id: payment-service
              uri: http://localhost:4010
              predicates:
                - Path=/api/v1/payments/**,/api/v1/wallet/**,/api/v1/withdrawals/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, INTERNAL_SERVER_ERROR
                    methods: GET, POST, PATCH

            # =====================
            # INTERNAL WITHDRAWAL
            # =====================
            - id: internal-withdrawal-process
              uri: http://localhost:4010
              predicates:
                - Path=/api/internal/withdrawals/*/process

            - id: internal-withdrawal-complete
              uri: http://localhost:4010
              predicates:
                - Path=/api/internal/withdrawals/*/complete

            - id: internal-withdrawal-fail
              uri: http://localhost:4010
              predicates:
                - Path=/api/internal/withdrawals/*/fail


            # =====================
            # NOTIFICATION SERVICE
            # =====================
            - id: notification-service
              uri: http://localhost:4009
              predicates:
                - Path=/api/v1/notifications/**

            # =====================
            # RATING SERVICE
            # =====================
            - id: rating-service
              uri: http://localhost:4006
              predicates:
                - Path=/api/v1/ratings/**

  circuitbreaker:
    resilience4j:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      bookingService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

      paymentService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

  timelimiter:
    instances:
      bookingService:
        timeoutDuration: 10s

      paymentService:
        timeoutDuration: 10s

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: TRACE
    org.springframework.cloud.gateway.filter: TRACE
    reactor.netty: DEBUG

jwt:
  secret: dummy
