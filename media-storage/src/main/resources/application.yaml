spring:
  application:
    name: media-storage-service

  datasource:
    url: jdbc:postgresql://localhost:5443/media_db
    username: media_user
    password: media_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true

server:
  port: 4011

jwt:
  secret: 4056c5aac4e8a8087803bc3b861da689

storage:
  provider: s3

  s3:
    endpoint: ${STORAGE_S3_ENDPOINT:}
    region: ${STORAGE_S3_REGION:eu-north-1}
    bucket: ${STORAGE_S3_BUCKET:provia-media-bucket-storage-460715959469-eu-north-1-an}
    path-style-access-enabled: ${STORAGE_S3_PATH_STYLE:false}
    auto-create-bucket: ${STORAGE_S3_AUTO_CREATE_BUCKET:false}
    initialize-bucket: ${STORAGE_S3_INITIALIZE_BUCKET:false}
    profile-photos-prefix: ${STORAGE_S3_PROFILE_PHOTOS_PREFIX:profile-photos}
    documents-prefix: ${STORAGE_S3_DOCUMENTS_PREFIX:documents}

  profile-photo:
    max-size-bytes: 5242880
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp

  document:
    max-size-bytes: 20971520
    allowed-content-types:
      - application/pdf