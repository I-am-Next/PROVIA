server:
  port: ${SERVER_PORT:4009}

spring:
  application:
    name: notification-service

  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5440/notification_db}
    username: ${NOTIFICATION_DB_USERNAME:notification_user}
    password: ${NOTIFICATION_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:notification-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

notification:
  outbox:
    publish-delay: ${NOTIFICATION_OUTBOX_PUBLISH_DELAY:5000}
    claim-timeout-seconds: ${NOTIFICATION_OUTBOX_CLAIM_TIMEOUT_SECONDS:300}

  kafka:
    bookings: booking-events
    payments: payment-events
    quotes: quote-events
    escrows: escrow-events
    wallets: wallet-events
    ratings: rating-events
    chats: chat-events
    system: system-events
    admin: admin-events

services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:4003}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.springframework.security: INFO
    org.springframework.kafka: INFO
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:WARN}
    com.pm.notificationservice: ${NOTIFICATION_LOG_LEVEL:INFO}
