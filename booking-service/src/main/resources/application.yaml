
server:
  port: ${BOOKING_SERVICE_PORT:4001}

spring:
  application:
    name: booking-service

  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5435/booking_db}
    username: ${BOOKING_DB_USERNAME}
    password: ${BOOKING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas:
      - public
    table: flyway_schema_history
    validate-on-migrate: true
    clean-disabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: booking-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

booking:
  kafka:
    payment-events-topic: ${PAYMENT_EVENTS_TOPIC:payment-events}
    escrow-events-topic: ${ESCROW_EVENTS_TOPIC:escrow-events}
  quote:
    expiration-hours: ${BOOKING_QUOTE_EXPIRATION_HOURS:48}

provider-service:
  url: ${PROVIDER_SERVICE_URL:http://localhost:4004}

payment-service:
  url: ${PAYMENT_SERVICE_URL:http://localhost:4010}

jwt:
  secret: ${JWT_SECRET}

internal:
  service-key: ${INTERNAL_SERVICE_KEY}

logging:
  level:
    org.springframework.security: ${SPRING_SECURITY_LOG_LEVEL:INFO}
