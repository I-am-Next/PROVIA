server:
  port: 4010

spring:
  application:
    name: payment-service

  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5439/payment_db}
    username: ${PAYMENT_DB_USERNAME:payment_user}
    password: ${PAYMENT_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: localhost:9092

payment:
  kafka:
    topics:
      payments: payment-events
      escrows: escrow-events
      wallets: wallet-events

jwt:
  secret: ${JWT_SECRET}

booking-service:
  url: http://localhost:4001

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY}
  public-key: ${PAYSTACK_PUBLIC_KEY}
  base-url: https://api.paystack.co
  callback-url: ${PAYSTACK_CALLBACK_URL}

internal:
  service-key: ${INTERNAL_SERVICE_KEY}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
