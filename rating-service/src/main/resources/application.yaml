server:
  port: ${SERVER_PORT:4006}

spring:
  application:
    name: rating-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5441/rating_db}
    username: ${RATING_DB_USERNAME}
    password: ${RATING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

    consumer:
      group-id: rating-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

rating:
  kafka:
    events-topic: ${RATING_EVENTS_TOPIC:rating-events}

  outbox:
    publish-delay: ${RATING_OUTBOX_PUBLISH_DELAY:5000}

booking-service:
  url: ${BOOKING_SERVICE_URL:http://localhost:4001}

jwt:
  secret: ${JWT_SECRET}